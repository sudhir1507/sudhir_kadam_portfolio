name: CI/CD

on:
  push:
    branches: [myportfolio]
  pull_request:
    branches: [myportfolio]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /sudhir_kadam_portfolio/
          VITE_SITE_URL: https://sudhir1507.github.io/sudhir_kadam_portfolio
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_CONTACT_EMAIL: Kadamsudhir362@gmail.com
          VITE_CONTACT_PHONE: '9359831795'
          VITE_CONTACT_LOCATION: Pune, India
          VITE_GITHUB_URL: https://github.com/sudhir1507?tab=repositories
          VITE_GITHUB_PROFILE_URL: https://github.com/sudhir1507
          VITE_LINKEDIN_URL: https://www.linkedin.com/in/sudhir-kadam-b32371212/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/myportfolio'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
