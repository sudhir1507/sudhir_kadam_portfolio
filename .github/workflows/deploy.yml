name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /sudhir_kadam_portfolio/
          VITE_SITE_URL: https://sudhir1507.github.io/sudhir_kadam_portfolio
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_CONTACT_EMAIL: Kadamsudhir362@gmail.com
          VITE_CONTACT_PHONE: '9359831795'
          VITE_CONTACT_LOCATION: Pune, India
          VITE_GITHUB_URL: https://github.com/sudhir1507?tab=repositories
          VITE_GITHUB_PROFILE_URL: https://github.com/sudhir1507
          VITE_LINKEDIN_URL: https://www.linkedin.com/in/sudhir-kadam-b32371212/

      - name: Add Pages fallbacks
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
